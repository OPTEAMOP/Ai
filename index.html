  <body class="bg-slate-50 text-slate-900 antialiased font-sans dark:bg-[#121212] dark:text-slate-100 transition-colors duration-300">
    <!-- Hardcoded HTML Pre-loader (Legacy safe positioning for Mobile WebViews) -->
    <div id="omni-global-loader" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; background-color: #FFFFFF; z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; padding: 0;">
      <div class="spinner" style="width: 40px; height: 40px; border: 4px solid #F3F4F6; border-top: 4px solid #5865F2; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <h3 style="color: #111827; margin-top: 20px; font-family: sans-serif;">Omnisym AI is starting...</h3>
      <p style="color: #6B7280; font-size: 14px; font-family: sans-serif;">Connecting to secure cloud vaults</p>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>

    <div id="root"></div>

    <!-- Diagnostic Sentinel: Logs failures to console -->
    <script>
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          console.error('Asset Load Failure:', e.target.src || e.target.href);
        }
      }, true);
    </script>

    <script>
      // Force Reset Function
      window.clearOmnisymCache = function() {
        try {
          localStorage.clear();
          sessionStorage.clear();
          window.location.reload(true);
        } catch (e) {
          window.location.reload(true);
        }
      };

      // Proactive Network Health Diagnostic Tool
      (function() {
        console.group('%c🛡️ Omnisym Network Health Check', 'color: #6366f1; font-weight: bold; font-size: 12px;');
        
        function auditAssets() {
          const scripts = Array.from(document.scripts);
          const links = Array.from(document.getElementsByTagName('link'));
          
          console.log('%cChecking critical scripts...', 'color: #94a3b8;');
          scripts.forEach(s => {
            if (s.src) {
              const status = s.complete || (window.__OMNISYM_MOUNTED__ && s.src.includes('main.tsx')) ? '✅' : '⏳';
              console.log(`${status} Script: ${new URL(s.src).pathname.split('/').pop() || s.src} (${s.src})`);
            }
          });

          console.log('%cChecking critical styles...', 'color: #94a3b8;');
          links.forEach(l => {
            if (l.rel === 'stylesheet' || l.href.includes('fonts.googleapis.com')) {
              try {
                const isLoaded = l.sheet && l.sheet.cssRules.length > 0;
                console.log(`✅ Style: ${l.href.split('/').pop()} (Loaded)`);
              } catch (e) {
                console.warn(`⚠️ Style: ${l.href.split('/').pop()} (Possibly Blocked or Cross-Origin)`);
              }
            }
          });
          console.groupEnd();
        }

        // Run audit on load and then again after a short delay
        window.addEventListener('load', auditAssets);
        setTimeout(auditAssets, 3000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
